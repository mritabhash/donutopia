name: Check live AI judge
on:
  push:
    paths:
      - backend/wrangler.jsonc
      - .github/workflows/check-ai.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed Worker without changing the website
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = 'https://donutopia-api.mritabhash.workers.dev'
          origin = 'https://mritabhash.github.io'
          def call(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              headers = {'Origin': origin, 'Content-Type': 'application/json'}
              with urlopen(Request(base + path, data=body, headers=headers), timeout=45) as response:
                  return response.status, json.load(response)

          status, health = call('/health')
          print('health', status, health)
          assert status == 200 and health['ok'] and health['questions'] == 351
          status, game = call('/api/unlimited/1')
          assert status == 200 and game['version'] == health['version']
          assert len(game['prompts']) == 7
          question = next(q for q in game['prompts'] if q['text'] == 'Name a tree native to Australia')
          status, result = call('/api/unlimited/1/submit', {
              'version': game['version'], 'promptId': question['id'], 'answer': 'Eucalyptus'
          })
          print('judge', status, result)
          assert status == 200 and result['accepted'] and result['score'] > 0
          PY
